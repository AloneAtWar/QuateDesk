<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声纳信号 · 桌面与安卓全景</title><style>body{margin:0;background:#e8ebe7;color:#23342c;font:13px/1.5 'Segoe UI','Microsoft YaHei',sans-serif}.board{width:1200px;height:820px;padding:24px 28px;box-sizing:border-box;background:radial-gradient(circle at 100% 0,#d3dfd8,transparent 40%),#e8ebe7}.top{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid #2a4235;padding-bottom:14px;margin-bottom:18px}.top small{color:#4d7560;font:800 11px Consolas,monospace;letter-spacing:.16em}.top h1{font-size:28px;margin:2px 0 0}.top p{max-width:550px;margin:0;color:#435d4d;font-size:12px}.surfaces{display:grid;grid-template-columns:644px 238px 238px;gap:12px}.surface{min-width:0}.surface label{display:block;height:22px;color:#54705d;font:700 11px Consolas,'Microsoft YaHei',monospace}.surface img{display:block;width:100%;object-fit:cover;object-position:top;border:1px solid #7d9886;border-radius:6px;box-shadow:0 10px 20px #213b2c25}.surface.desktop img{height:440px}.surface.phone-shot img{height:515px}.scanner{height:109px;margin-top:10px;border-radius:6px;position:relative;overflow:hidden;padding:10px 15px;background:linear-gradient(#05120de3,#05120de3),repeating-linear-gradient(90deg,#768a7a 0 1px,transparent 1px 80px);color:#e6eee6}.scanner b{display:block;font-size:13px}.scanner small{display:block;color:#b3c9b8;margin-top:5px}.reticle{position:absolute;right:33px;top:13px;width:120px;height:83px;border:2px solid #75ead2;border-radius:8px}.reticle:after{content:'';position:absolute;left:49px;top:31px;width:18px;height:18px;border:1px solid #75ead2;border-radius:50%}.notes{margin-top:16px;display:flex;gap:9px;flex-wrap:wrap}.notes span{background:#f6f8f3;border:1px solid #a9bcb0;border-radius:4px;padding:5px 9px;color:#34513c;font-size:11px}.bottom{margin-top:15px;color:#566c5c;font-size:12px}</style></head><body><div class="board"><div class="top"><div><small>07 / DESKTOP + NATIVE ANDROID + WEBVIEW</small><h1>声纳信号</h1></div><p>把每个账号和配对电脑视为可定位的信号站。圆环成为声纳扫描面，刷新队列像下一次回波。</p></div><div class="surfaces"><div class="surface desktop"><label>桌面 · 当前看板</label><img src="shots/sonar-desktop/page.png" alt="声纳信号桌面效果图"><div class="scanner"><b>扫码页 · 原生相机覆盖层</b><small>相机画面保持中性暗色；主题只控制准星、提示与操作键。<br>扫码成功进入远程看板，主题身份保持一致。</small><i class="reticle"></i></div></div><div class="surface phone-shot"><label>安卓原生 · 设备列表</label><img src="shots/sonar-native/page.png" alt="声纳信号安卓设备页"></div><div class="surface phone-shot"><label>WebView · 额度看板</label><img src="shots/sonar-remote/page.png" alt="声纳信号手机额度页"></div></div><div class="notes"><span>原生设备页是信号站列表</span><span>WebView 首卡像一次回波</span><span>扫码取景框沿用声纳准星</span></div><div class="bottom">右上角「外观」打开同一台设备的主题选择；原生层与网页层共用主题 ID，系统栏只取最终主题的亮暗属性。</div></div></body></html>
