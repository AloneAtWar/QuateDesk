.cap{display:flex;align-items:center;gap:12px;padding-top:14px}.cap .no{font-family:var(--mono);font-size:13px;color:var(--faint);transition:color .2s}.cap .name{font-size:16px;font-weight:600;line-height:1.4;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cap .strip-mini{margin:0 auto 0 4px;width:40px;flex:none}.cap .no.base{flex:none;white-space:nowrap;font-family:inherit;font-size:12px;font-weight:600;line-height:1.6;padding:0 8px;border-radius:99px;background:var(--well);color:var(--soft)}

.stage.offline .static{display:none}
.slide .static{display:none}.static{position:absolute;left:10px;bottom:10px;z-index:2;font-size:12.5px;line-height:1.4;padding:3px 8px;border-radius:4px;background:#000c;color:#ddd;pointer-events:none}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes vt-out{to{opacity:0;transform:scale(.97)}}

/* 并排与单张之间、视口变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */

::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

olor: var(--green-deep); font-size: 9px; font-weight: 700; }\n.refresh-chip b { flex: 0 0 auto; color: var(--green-deep); font-size: 9px; font-weight: 700; }\n.refresh-chip b.fine { color: color-mix(in srgb, var(--cyan) 50%, var(--ink)); }\n.refresh-chip b.warn { color: color-mix(in srgb, var(--amber) 50%, var(--ink)); }\n.refresh-chip b.waste { color: color-mix(in srgb, var(--coral) 50%, var(--ink)); }\n.refresh-chip b.spent { color: var(--ink-soft); }\n.reset-timeline { overflow-x: auto; overflow-y: hidden; cursor: grab; padding: 2px 12px 8px; user-select: none; }\n.reset-timeline:active { cursor: grabbing; }\n.timeline-track { position: relative; height: 62px; }\n.timeline-axis { position: absolute; left: 0; right: 0; top: 28px; height: 2px; border-radius: 2px; background: var(--line-strong); }\n.timeline-now { position: absolute; top: 20px; left: 0; width: 2px; height: 18px; background: var(--coral); }\n.timeline-now span { position: absolute; top: -12px; left: 0; color: var(--coral); font-size: 8px; white-space: nowrap; }\n.timeline-tick { position: absolute; top: 24px; width: 1px; height: 10px; background: var(--line-strong); }\n.timeline-tick span { position: absolute; top: -13px; left: -15px; width: 32px; text-align: center; color: var(--faint); font-size: 8px; }\n.timeline-point { position: absolute; top: 25px; margin-left: -4px; }\n.timeline-point i { display: block; width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); }\n.timeline-point i.sky { background: #4099d9; }\n.timeline-point i.violet { background: #7668d1; }\n.timeline-point i.blue { background: #4389c8; }\n.timeline-point i.coral { background: #d97961; }\n.timeline-point i.mint { background: #7fc79b; }\n.timeline-point i.slate { background: #67777b; }\n.timeline-point span { position: absolute; top: 13px; left: -22px; width: 52px; text-align: center; color: var(--muted); font-size: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.reset-timeline::-webkit-scrollbar { height: 4px; }\n.reset-timeline::-webkit-scrollbar-thumb { border-radius: 3px; background: var(--scrollbar); }\n.reset-timeline::-webkit-scrollbar-track { background: transparent; }\n\n/* rows view: status under the identity, rows grow with stacked meters */\n.account-window-row { grid-template-columns: minmax(120px, .8fr) 1.5fr; min-height: 88px; align-items: center; }\n.account-side { display: grid; gap: 3px; align-content: center; min-width: 0; }\n.account-side .account-status { margin-top: 0; font-size: 9px; gap: 4px; }\n.account-side .account-status small { font-size: 8px; margin-left: 4px; }\n.account-meters { align-content: center; }\n.account-meters .rule-marks .tag-pill { font-size: 8px; padding: 1px 5px; }\n/* periods view: fixed single-line rows, no trailing button column */\n.priority-row { grid-template-columns: minmax(112px, .85fr) 1.25fr auto; height: 40px; }\n.section-heading h2 { margin-top: 0; }\n\n/* periods view final override: taller rows, fixed reset column so bars never drift */\n.priority-row { grid-template-columns: minmax(112px, .85fr) 1.25fr 118px; height: 62px; }\n.priority-reset { justify-content: flex-end; }\n.priority-reset .rule-marks .tag-pill { max-width: 42px; }\n/* timeline: hover detail strip (no floating tooltip, avoids scroll clipping) */\n.timeline-detail { display: flex; align-items: baseline; gap: 8px; min-height: 20px; padding: 0 12px 2px; font-size: 9px; color: var(--muted); }\n.timeline-detail b { font-size: 10px; color: var(--ink); }\n.timeline-detail em { font-style: normal; }\n.timeline-detail strong { color: var(--green); font-size: 10px; }\n.timeline-detail small { color: var(--faint); }\n.timeline-detail-hint { color: var(--faint); font-size: 8px; }\n.timeline-tick.near span { color: var(--green-deep); font-weight: 700; }\n.priority-meter b { width: 46px; min-width: 46px; flex: 0 0 46px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n\n/* periods view: give the identity a fixed track so names never collapse to ellipses */\n.priority-row { grid-template-columns: 132px 1fr 118px; }\n.priority-row .account-title-line .tag-pill { max-width: 52px; overflow: hidden; text-overflow: ellipsis; }\n\n/* rows view: every part has a reserved size so bars keep one consistent length */\n.account-window-row { grid-template-columns: 124px 1fr; }\n.meter-line { grid-template-columns: 36px 1fr 112px 88px; gap: 5px; }\n.meter-line .meter-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.meter-line .meter-reading { overflow: hidden; white-space: nowrap; }\n.meter-line .meter-reading small { overflow: hidden; text-overflow: ellipsis; }\n.meter-line .reset-meta { overflow: hidden; text-overflow: ellipsis; }\n/* periods view: identity track wide enough for five characters plus a tag */\n.priority-row { grid-template-columns: 140px 1fr 118px; }\n/* timeline: two-line point labels (account name + window and time) */\n.timeline-track { height: 72px; }\n.timeline-point span { top: 12px; left: -28px; width: 64px; display: grid; gap: 1px; text-align: center; }\n.timeline-point span b { font-size: 8px; font-weight: 700; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; }\n.timeline-point span em { font-style: normal; font-size: 8px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; }\n\n/* 版本更新:标题栏升级徽章与更新弹窗 */\n.update-badge { display: inline-flex; align-items: center; gap: 4px; border: 0; border-radius: 9px; padding: 3px 8px; font-size: 10px; font-weight: 700; background: var(--coral); color: #fff; }\n.update-badge:hover { filter: brightness(1.06); }\n.update-badge.downloading { background: var(--green-deep); }\n.update-badge.downloaded { background: var(--green-deep); }\n.update-badge.error { background: #b4552f; }\n/* 主窗口固定 520×470，弹窗 max-height 约 374px：改为纵向 flex 布局，\n   更新说明是唯一弹性区域、在内部滚动，标题与操作按钮永远可见 */\n.update-modal { display: flex; flex-direction: column; }\n.update-modal .release-notes { white-space: pre-wrap; flex: 1 1 auto; min-height: 48px; overflow-y: auto; margin: 12px 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-size: 12px; line-height: 1.65; }\n.update-modal .modal-actions { flex: 0 0 auto; margin-top: 12px; padding-top: 13px; }\n.update-modal .ignore-button { margin-right: auto; }\n.update-modal .update-error { color: var(--coral-deep); }\n.update-progress { height: 6px; margin: 12px 0; border-radius: 4px; background: var(--meter-track); overflow: hidden; }\n.update-progress i { display: block; height: 100%; border-radius: 4px; background: var(--coral); transition: width .2s ease; }\n\n/* 桌面浮窗尺寸滑条与等比缩放容器 */\n.size-slider { display: grid; grid-template-columns: 30px 1fr 46px; align-items: center; gap: 9px; padding: 7px 0; }\n.size-slider span { color: var(--ink-soft); font-size: 11px; font-weight: 700; }\n.size-slider input[type=range] { width: 100%; margin: 0; accent-color: var(--green); }\n.size-slider b { color: var(--muted); font-size: 10px; font-weight: 600; text-align: right; white-space: nowrap; }\n.widget-preview-frame .widget-row { width: 100%; height: auto; min-height: 100%; margin: 0; border: 1px solid var(--widget-row-border); }\n/* 浮窗窗口最终几何：行卡片填满窗口并四周留 4px，覆盖历史固定尺寸 */\n.widget-window-shell { padding: 4px; align-items: stretch; }\n.widget-window-shell .widget-row, .widget-window-shell .widget-row.compact { width: 100%; height: 100%; }\n/* 浮窗等比缩放：scale-layer 占满窗口，frame 布局尺寸反向缩小后 transform 放大 */\n.widget-scale-layer { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }\n.widget-scale-frame { flex: none; transform-origin: center center; }\n.widget-scale-frame .widget-row, .widget-scale-frame .widget-row.compact { width: 100%; height: 100%; }\n.widget-preview-window { display: flex; padding: 4px; border-radius: 8px; background: var(--widget-bg); }\n.widget-preview-window .widget-row { border: 1px solid var(--widget-row-border); }\n/* cc-switch 导入 */\n.drawer-import-button { margin-top: 10px; }\n.import-list { max-height: 320px; overflow-y: auto; }\n/* 订阅登录导入弹窗：主窗口只有 ~470px 高，行距与留白整体收紧、列表不限高，一屏放下全部渠道 */\n.import-modal { padding: 15px 16px; }\n.import-modal .modal-head { margin-bottom: 9px; }\n.import-modal .modal-head h2 { margin-top: 0; font-size: 18px; }\n.import-modal .modal-actions { margin-top: 10px; padding-top: 11px; }\n/* 订阅登录导入：每个渠道一张等高小卡片（无分隔线），行内留白统一 */\n.import-modal .settings-list.import-list { max-height: none; overflow: visible; gap: 8px; }\n.import-row { cursor: pointer; }\n.import-row input { flex: 0 0 auto; margin: 0; }\n/* Kimi 订阅扫码登录：居中的二维码舞台 + 状态行（过期/失败给操作按钮） */\n/* 标题旁问号帮助：气泡经 portal + fixed 渲染在 body 顶层，不受弹窗裁剪、不产生横向溢出 */\n.title-help { display: inline-grid; place-items: center; width: 17px; height: 17px; margin-left: 5px; border: 1px solid var(--line); border-radius: 50%; color: var(--muted); cursor: help; vertical-align: -2px; }\n.title-help:focus-visible { border-color: var(--focus-border); }\n.drawer-section-title > .title-help { width: 15px; height: 15px; margin-left: 1px; border: 0; color: var(--faint); vertical-align: 0; }\n.drawer-section-title > .title-help svg { width: 15px; height: 15px; color: inherit; }\n.drawer-section-title > .title-help:focus-visible { outline: 2px solid var(--focus-border); outline-offset: 2px; }\n.title-help-pop { position: fixed; width: 248px; max-height: min(220px, calc(100vh - 16px)); overflow-y: auto; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 11px; line-height: 1.65; text-align: left; z-index: 300; box-shadow: var(--shadow-strong); pointer-events: none; animation: fade-in .15s ease-out; }\n/* 订阅登录导入弹窗：列表 / 扫码 / 账号设置共用同一个固定尺寸的窗口，切换视图时尺寸不变 */\n.import-window { display: flex; flex-direction: column; height: min(420px, calc(100vh - 62px)); min-height: 376px; }\n.import-window > .modal-head, .import-window > .modal-actions { flex: 0 0 auto; }\n.import-window > .import-grid, .import-window > .kimi-qr-stage, .import-window > .kimi-qr-configure, .import-window > .cli-import-stage, .import-window > .copilot-device-stage, .import-window > .custom-account-scroll { flex: 1 1 auto; min-height: 0; }\n.import-window > .modal-actions { margin-top: auto; padding-top: 13px; }\n.import-window > .import-grid { overflow-y: auto; }\n/* 订阅登录导入：每行三个厂商磁贴，网格占满弹窗高度；右侧留白 26px 让滚动条离磁贴远一些；\n   磁贴不超过 9 个时滚动条不显示，滚到底部留 10px 空白。不可用（未登录 / 已收录）置灰 */\n.import-grid { display: grid; grid-template-columns: repeat(3, 68px); gap: 15px 17px; align-content: start; justify-content: center; height: 100%; margin: 0 auto; padding: 8px 26px 12px 8px; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }\n.import-tile { width: 68px; height: 68px; display: grid; place-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface-2); cursor: pointer; touch-action: none; user-select: none; transition: transform .12s ease-out, border-color .12s ease-out, box-shadow .12s ease-out, filter .12s ease-out, opacity .12s ease-out; }\n.import-tile .provider-logo { width: 100%; height: 100%; border-radius: 11px; font-size: 16px; pointer-events: none; }\n.import-tile .provider-logo img { -webkit-user-drag: none; user-select: none; }\n.import-tile:hover:not(.is-disabled):not(.is-dragging) { border-color: var(--focus-border); box-shadow: 0 8px 18px rgba(30, 41, 42, .14); transform: translateY(-2px); }\n.import-tile.is-dragging { opacity: .55; transform: scale(.94); cursor: grabbing; }\n.import-tile.is-over { border-color: var(--focus-border); border-style: dashed; box-shadow: 0 0 0 3px var(--focus-ring); }\n.import-tile.is-disabled { cursor: not-allowed; filter: grayscale(1); opacity: .42; }\n.import-tile > svg { color: var(--muted); }\n.import-grid::-webkit-scrollbar { width: 8px; }\n.import-grid::-webkit-scrollbar-thumb { border-radius: 4px; background: var(--scrollbar); border: 2px solid transparent; background-clip: content-box; }\n.import-grid::-webkit-scrollbar-track { background: transparent; }\n/* 「添加账号」弹窗内的自定义账号表单：内容区滚动，标题 / 操作条固定，窗口尺寸与其它视图一致 */\n.custom-account-scroll { display: block; overflow-y: auto; padding: 0 2px 6px; }\n.custom-account-scroll .field input, .custom-account-scroll .field select { height: 33px; }\n.cli-import-stage { display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 6px 0; overflow-y: auto; }\n/* Kimi 订阅扫码登录：主窗口只有 ~470px 高且 520px 宽（命中 620px 移动端断点）。\n   两步式弹窗：扫码页与账号设置页共用同一固定内容高度，切换步骤时弹窗尺寸不变；\n   账号名 / 标签竖排两行 */\n.kimi-qr-modal .form-grid { grid-template-columns: 1fr; gap: 4px; }\n.kimi-qr-modal .field { gap: 5px; margin-bottom: 6px; }\n.kimi-qr-modal .field input { height: 33px; }\n.kimi-qr-stage, .kimi-qr-configure { min-height: 236px; }\n.kimi-qr-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; padding: 6px 0; }\n.kimi-qr-frame { position: relative; width: 172px; height: 172px; }\n.kimi-qr-image, .kimi-qr-placeholder { width: 172px; height: 172px; border-radius: 14px; background: #fff; display: grid; place-items: center; }\n.kimi-qr-placeholder { color: var(--muted); }\n/* 过期 / 出错：二维码变灰，红色圆形刷新按钮盖在中央，点击即重扫 */\n.kimi-qr-frame.stale img { filter: grayscale(1); opacity: .4; }\n.kimi-qr-refresh { position: absolute; inset: 0; margin: auto; width: 48px; height: 48px; display: grid; place-items: center; border: none; border-radius: 50%; background: var(--coral); color: #fff; cursor: pointer; box-shadow: 0 4px 16px rgba(0, 0, 0, .35); transition: transform .12s ease-out; }\n.kimi-qr-refresh:hover { transform: scale(1.08); }\n.kimi-qr-status { color: var(--muted); text-align: center; }\n.kimi-qr-status.ok { color: var(--green); }\n.kimi-qr-status.fail { color: var(--coral); }\n/* 第二步：扫码确认后的账号信息设置（成功横条 + 账号名 / 标签两行） */\n.kimi-qr-configure { display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 6px 0; }\n.kimi-qr-ok { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 9px; background: var(--green-bg-2); }\n.kimi-qr-ok > div { display: grid; gap: 2px; }\n.kimi-qr-ok b { font-size: 12px; }\n.kimi-qr-ok small { color: var(--muted); font-size: 11px; }\n.kimi-qr-done-icon { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; color: var(--green); background: var(--green-bg); flex: 0 0 auto; }\n.kimi-qr-done-icon.duplicate { color: var(--coral-deep); background: var(--coral-bg); }\n/* Kimi 磁贴登录方式选择：扫码（含月额度）/ API Key（无月额度）两个大按钮 + 说明 */\n.kimi-entry-stage { gap: 9px; }\n.kimi-entry-option { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 11px; color: var(--ink); background: var(--control); text-align: left; cursor: pointer; transition: border-color .12s ease-out, transform .12s ease-out; }\n.kimi-entry-option:hover { border-color: var(--focus-border); transform: translateY(-1px); }\n.kimi-entry-icon { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; color: var(--green-deep); background: var(--green-bg); flex: 0 0 auto; }\n.kimi-entry-copy { display: grid; gap: 2px; }\n.kimi-entry-copy b { font-size: 12px; }\n.kimi-entry-copy small { color: var(--muted); font-size: 11px; }\n/* Kimi API Key 账号的扫码登录升级卡片（账号编辑弹窗内） */\n.kimi-upgrade-card { display: grid; gap: 9px; margin: 2px 0 16px; }\n.kimi-upgrade-button { justify-self: start; display: inline-flex; align-items: center; gap: 6px; }\n/* GitHub Copilot 设备码登录：大号等宽设备码卡片（点击复制）+ 打开授权页按钮，与扫码页同高 */\n.copilot-device-stage { min-height: 236px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 6px 0; }\n.copilot-code-frame { display: grid; gap: 7px; justify-items: center; padding: 20px 30px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); cursor: pointer; transition: border-color .12s ease-out, transform .12s ease-out; }\n.copilot-code-frame:hover { border-color: var(--focus-border); transform: translateY(-1px); }\n.copilot-code-frame small { color: var(--faint); font-size: 10px; }\n.copilot-code-frame b { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 24px; letter-spacing: 2px; color: var(--ink); }\n.copilot-code-frame.stale { opacity: .55; }\n.copilot-code-frame.stale b { text-decoration: line-through; }\n.copilot-stage-actions { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }\n.copilot-open-button { flex: 0 0 auto; }\n/* 令牌失效后的重新扫码入口：总览卡片的异常图标变成可点按钮，行式视图在「需处理」旁给文字入口 */\n.card-status-icon.relogin { border: none; padding: 0; cursor: pointer; transition: transform .12s ease-out; }\n.card-status-icon.relogin:hover { transform: scale(1.15); }\n.text-button.relogin-link { display: inline-flex; align-items: center; gap: 3px; flex: 0 0 auto; color: var(--coral); font-size: 10px; }\n/* 添加账号表单底部：CLI 官方订阅引导脚注（轻量，不打断表单视觉） */\n.cli-import-hint { display: flex; align-items: center; gap: 6px; margin: -4px 0 14px; color: var(--faint); font-size: 10px; }\n.cli-import-hint .text-button { margin-left: auto; }\n/* 厂商弹窗 New API 模板预设 */\n.preset-grid { grid-template-columns: auto 1fr; align-items: center; margin: 0 0 14px; }\n.preset-hint { color: var(--faint); font-size: 10px; }\n/* 额度历史折线图 */\n.overview-card.clickable { cursor: pointer; transition: border-color .18s ease; }\n.overview-card.clickable:hover { border-color: var(--hover-border); }\n.overview-card.clickable.dragging,\n.overview-card.clickable.dragging:hover { cursor: grabbing; border-color: var(--hover-border); }\n.overview-card.clickable.drag-over,\n.overview-card.clickable.drag-over:hover { border-color: var(--focus-border); }\n.history-view { gap: 12px; }\n.history-view .surface-section { padding-bottom: 4px; }\n.history-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px 10px; border-bottom: 1px solid var(--line); }\n.history-head .account-identity { flex: 1; min-width: 0; }\n.range-control { display: flex; flex: 0 0 auto; gap: 0; }\n.range-control button { border: 0; padding: 1px 5px; border-radius: 4px; color: var(--ink-soft); background: transparent; font-size: 9px; }\n.range-control button.active { color: var(--ink); background: var(--surface-3); }\n.range-control button:hover:not(.active):not(:disabled) { color: var(--ink-soft); }\n.range-control button:disabled { opacity: .32; cursor: default; }\n.back-button { flex: 0 0 auto; width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink-soft); background: var(--control); }\n.back-button:hover { color: var(--ink); border-color: var(--hover-border); }\n/* 趋势/浪费两个视图主体锁成同一固定高度，切换时整个卡片与头部切换按钮都不动；多余空间由图例行（趋势）或滚动区（浪费）吸收 */\n.trend-view { height: 271px; display: flex; flex-direction: column; }\n.trend-view .chart-legend { margin-top: auto; }\n.usage-chart { position: relative; padding: 10px 8px 2px; user-select: none; }\n.usage-chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; }\n.chart-grid { stroke: var(--line-inner); stroke-width: 1; }\n.chart-y-label, .chart-x-label { fill: var(--faint); font-size: 9px; font-family: 'DM Mono', monospace; }\n.chart-y-label { text-anchor: end; }\n.chart-x-label { text-anchor: middle; }\n.chart-cursor { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3 3; }\n.chart-cursor.selected { stroke: var(--ink-soft); stroke-width: 1.2; stroke-dasharray: 2 3; }\n.chart-detail { display: flex; align-items: center; gap: 4px; min-height: 22px; margin: 0 6px 4px; padding: 3px 6px 3px 8px; border: 1px solid var(--line-inner); border-radius: 7px; background: var(--surface-2); overflow: hidden; white-space: nowrap; }\n/* 详情文字窄窗口放不下时横向滑动看全：范围按钮固定在右侧不随滚动；\n   滚动条整个隐藏（不做滑动框样式），触屏/鼠标拖动/滚轮平移均可 */\n.chart-detail-main { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }\n.chart-detail-main::-webkit-scrollbar { display: none; }\n/* 浪费视图详情行的内容直接挂在 .chart-detail 下（无 main 包裹），同样支持横向滑动 */\n.chart-detail.waste-detail { overflow-x: auto; scrollbar-width: none; }\n.chart-detail.waste-detail::-webkit-scrollbar { display: none; }\n.chart-detail-main > b { flex: 0 0 auto; color: var(--muted); font-size: 10px; font-weight: 600; }\n.chart-detail-item { display: inline-flex; align-items: center; gap: 3px; flex: 0 0 auto; font-size: 10px; color: var(--ink-soft); }\n.chart-detail-item b { color: var(--ink); font-weight: 700; }\n.chart-detail-item small { color: var(--faint); font-size: 9px; }\n.chart-detail-hint { color: var(--ink-soft); font-size: 10px; }\n.chart-detail i, .chart-legend i { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }\n.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 4px 18px 8px; border-top: 1px solid var(--line-inner); }\n.chart-legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); }\n.chart-legend em { font-style: normal; font-weight: 700; color: var(--ink); }\n.chart-legend small { font-size: 9px; color: var(--faint); }\n.chart-empty { padding: 34px 16px; }\n\n/* 浮窗省略号模式下解除名称块宽度上限：让内容撑满以便检测溢出，标签先于名称被收起 */\n.widget-row.ellipsis .widget-account-block { max-width: none; }\n/* 名称优先：空间不足时标签先被压缩省略，而不是账号名 */\n.account-title-line .tag-pill { flex: 0 4 auto; min-width: 14px; overflow: hidden; text-overflow: ellipsis; }\n/* 行式/周期视图的账号行可点击进入趋势图 */\n.account-window-row.clickable, .priority-row.clickable { cursor: pointer; }\n.usage-chart.zoomed svg { cursor: grab; }\n.usage-chart.zoomed svg:active { cursor: grabbing; }\n.chart-tools { display: flex; align-items: center; justify-content: space-between; padding: 0 12px 4px; min-height: 18px; }\n.chart-hint { color: var(--faint); font-size: 9px; }\n.chart-reset { border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; color: var(--ink-soft); background: var(--control); font-size: 9px; }\n.chart-reset:hover { color: var(--ink); border-color: var(--hover-border); }\n.chart-legend button { display: inline-flex; align-items: center; gap: 6px; border: 0; padding: 2px 0; color: var(--muted); background: transparent; font-size: 10px; cursor: pointer; }\n.chart-legend button:hover { color: var(--ink); }\n.chart-legend button.off { opacity: .38; }\n.chart-legend button em { font-style: normal; font-weight: 700; color: var(--ink); }\n\n/* 额度浪费统计视图（历史页「浪费」分段）：总高度不超过趋势视图，所有文字单行省略 */\n.seg-control { display: flex; flex: 0 0 auto; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 7px; background: var(--control); }\n.seg-control button { border: 0; padding: 3px 10px; border-radius: 5px; color: var(--ink-soft); background: transparent; font-size: 10px; }\n.seg-control button.active { color: var(--ink); background: var(--surface-3); }\n.seg-control button:hover:not(.active) { color: var(--ink-soft); }\n.waste-view { height: 271px; display: flex; flex-direction: column; padding: 10px 8px 2px; }\n.waste-view > * { flex: 0 0 auto; }\n.waste-view > .waste-scroll { flex: 1 1 auto; }\n.waste-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 24px; margin: 0 6px 6px; }\n.waste-label { font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; }\n.waste-stats { display: inline-flex; align-items: center; min-width: 0; font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; }\n.waste-stats b { color: var(--amber); font-weight: 700; }\n.waste-stats span + span::before { content: '·'; margin: 0 5px; color: var(--faint); }\n.waste-detail { display: block; overflow: hidden; text-overflow: ellipsis; font-size: 10px; color: var(--ink-soft); }\n.waste-detail > span { margin-right: 12px; }\n.waste-detail > span:last-child { margin-right: 0; }\n.waste-detail b { color: var(--ink); font-weight: 700; }\n.waste-detail .when { color: var(--ink); font-weight: 600; }\n.waste-detail .warn { color: var(--amber); }\n.waste-scroll { flex: 1 1 auto; min-height: 0; margin: 0 6px; display: flex; flex-direction: column; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; cursor: grab; border: 1px solid var(--line-inner); border-radius: 8px; background: var(--surface-2); user-select: none; }\n.waste-scroll::-webkit-scrollbar { display: none; }\n.waste-scroll.dragging { cursor: grabbing; }\n/* plot 高度 = 柱区（去掉顶部 10px 留白），网格线/平均线的 bottom 百分比都相对柱区 */\n.waste-plot { position: relative; flex: 1 1 auto; min-height: 0; margin-top: 10px; min-width: 100%; display: flex; align-items: flex-end; gap: 1px; padding: 0 10px; border-bottom: 1px solid var(--line-inner); }\n.waste-gridline { position: absolute; left: 10px; right: 10px; height: 1px; background: var(--line-inner); pointer-events: none; }\n.waste-col { flex: 1 0 8px; min-width: 8px; height: 100%; align-self: flex-end; display: flex; align-items: flex-end; }\n.waste-plot.mo .waste-col { flex: 1 0 26px; min-width: 26px; }\n.waste-bar { width: 100%; max-width: 18px; margin: 0 auto; border-radius: 3px 3px 0 0; min-height: 2px; }\n.waste-plot.mo .waste-bar { max-width: 24px; }\n.waste-plot.wk .waste-bar { background: linear-gradient(180deg, var(--violet), #6f5ee0); }\n.waste-plot.mo .waste-bar { background: linear-gradient(180deg, var(--coral), #d96a62); }\n/* 失真（最后观测距重置过远）：斜纹柱，浪费值只是上界 */\n.waste-plot.wk .waste-col.bad .waste-bar { background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--violet) 30%, transparent) 0 3px, transparent 3px 6px); border: 1px solid color-mix(in srgb, var(--violet) 55%, transparent); border-bottom: 0; }\n.waste-plot.mo .waste-col.bad .waste-bar { background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--coral) 30%, transparent) 0 3px, transparent 3px 6px); border: 1px solid color-mix(in srgb, var(--coral) 55%, transparent); border-bottom: 0; }\n/* 厂商提前重置：琥珀色点线框，周期不完整不计入统计 */\n.waste-col.early .waste-bar { background: color-mix(in srgb, var(--amber) 16%, transparent); border: 1px dotted var(--amber); border-bottom: 0; }\n/* 进行中的当前周期：青色虚线框 */\n.waste-col.now .waste-bar { background: color-mix(in srgb, var(--cyan) 15%, transparent); border: 1px dashed var(--cyan); border-bottom: 0; }\n.waste-col.hot .waste-bar { filter: brightness(1.35); }\n.waste-avg { position: absolute; left: 10px; right: 10px; height: 0; border-top: 1px dashed var(--amber); pointer-events: none; }\n.waste-avg em { position: absolute; left: 0; top: -9px; padding: 0 4px; color: var(--amber); background: var(--surface-2); font-size: 9px; font-style: normal; }\n.waste-empty-hint { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 11px; text-align: center; pointer-events: none; }\n.waste-empty-hint b { color: var(--ink); }\n.waste-x-labels { display: flex; flex: 0 0 auto; gap: 1px; min-width: 100%; padding: 3px 10px 2px; }\n.waste-x-cell { flex: 1 0 8px; min-width: 8px; overflow: hidden; white-space: nowrap; text-align: center; color: var(--faint); font-size: 8px; line-height: 11px; }\n.waste-x-labels.mo .waste-x-cell { flex-basis: 26px; min-width: 26px; }\n.waste-legend i { width: 11px; height: 8px; border-radius: 2px; }\n.waste-legend i.swatch-early { background: color-mix(in srgb, var(--amber) 16%, transparent); border: 1px dotted var(--amber); }\n.waste-legend i.swatch-now { background: color-mix(in srgb, var(--cyan) 15%, transparent); border: 1px dashed var(--cyan); }\n.chart-legend .legend-right { margin-left: auto; color: var(--faint); }\n\n/* ── 账号停用 ── */\n/* 总览里的停用卡片：档案式展示，整卡沉下去，悬停恢复可读性 */\n.overview-card.disabled { opacity: .62; }\n.overview-card.disabled:hover { opacity: 1; }\n.overview-card.disabled .provider-logo { filter: grayscale(1); }\n/* 卡片主体：只有停用时间与停用时长两行静态信息，整体居中 */\n.disabled-card-body { align-items: center; flex-direction: column; justify-content: center; gap: 0; padding: 4px 6px; }\n.disabled-copy { display: grid; gap: 4px; text-align: center; }\n.disabled-copy b { font-size: 13px; }\n.disabled-copy small { color: var(--faint); font-size: 10px; }\n/* 折叠态：一行文字入口 */\n.disabled-fold { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; padding: 2px; border: 0; background: none; color: var(--faint); font-size: 10px; cursor: pointer; }\n.disabled-fold:hover { color: var(--muted); }\n.disabled-fold svg { flex: 0 0 auto; }\n/* 历史页头部：账号右侧的内联停用标签（不另起一行） */\n.history-disabled-tag { display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto; color: var(--faint); font-size: 10px; white-space: nowrap; }\n/* 设置抽屉的停用账号行与停止/播放开关 */\n.settings-account.disabled { opacity: .55; }\n.settings-account.disabled:hover { opacity: 1; }\n.settings-account.disabled .provider-logo { filter: grayscale(1); }\n.status-dot.disabled { background: var(--muted); }\n.row-icon-button.stop { color: var(--coral); }\n.row-icon-button.stop svg { fill: currentColor; }\n.row-icon-button.stop:hover { color: var(--coral-deep); background: var(--coral-bg-2); }\n.row-icon-button.play { color: var(--green-deep); }\n.row-icon-button.play:hover { background: var(--green-bg); }\n/* 浮窗占位：无账号 / 全部停用——沿用 widget-row 卡片，内容整体居中\n   占满整条；加号做成圆形徽章（绿色强调），引导双击添加 */\n.widget-placeholder { justify-content: center; gap: 7px; color: var(--widget-chip-sub); font-size: 11px; }\n.widget-placeholder-icon { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; color: var(--widget-live); background: var(--widget-chip); }\n/* 应用内操作确认弹窗（替代系统级 window.confirm）：字号沿用「添加账号」等普通弹窗的规范（标题 18px / 正文 12px / 按钮 11px） */\n.confirm-modal .modal-head h2 { font-size: 18px; }\n.confirm-modal .confirm-message { margin: 0; color: var(--ink-soft); font-size: 12px; line-height: 1.65; }\n/* 小确认框不走表单弹窗的动作区间（23px+17px+分隔线对两行文字的弹窗太大），收紧为紧凑间距 */\n.confirm-modal .modal-actions { margin-top: 14px; padding-top: 0; border-top: 0; }\n.danger-button { padding: 9px 12px; border: 1px solid transparent; border-radius: 7px; font-size: 11px; font-weight: 700; color: #231009; background: var(--coral); }\n.danger-button:hover { background: var(--coral-deep); }\n:root[data-theme='light'] .danger-button { color: #fff; }\n\n/* ── 厂商官方账号服务端用量（一比一复刻 DeepSeek 界面演示）── */\n/* 三个页签统一 271px 主体；热力图方格按容器宽度自适应（5–14px），近 1 年 53 周完整铺满一屏 */\n/* 历史页视图切换下拉：四个入口常驻，不可用项置灰并在项内小字 / 悬停 title 说明原因 */\n.history-switch-dismiss { position: fixed; inset: 0; z-index: 48; }\n.history-switch-anchor { position: relative; flex: 0 0 auto; }\n.history-switch-anchor.open { z-index: 49; }\n.history-switch-toggle { display: flex; align-items: center; gap: 4px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink-soft); background: var(--control); font-size: 10px; }\n.history-switch-toggle:hover { color: var(--ink); border-color: var(--hover-border); }\n.history-switch-menu { position: absolute; top: calc(100% + 4px); right: 0; z-index: 49; min-width: 90px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); box-shadow: 0 8px 24px rgba(20, 40, 30, .14); }\n.history-switch-menu button { width: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1px 4px; padding: 3px 5px; border: 0; border-radius: 4px; background: transparent; color: var(--ink-soft); font-size: 9px; text-align: left; }\n.history-switch-menu button:hover, .history-switch-menu button.active { color: var(--green-deep); background: var(--green-bg); }\n.history-switch-menu button.disabled, .history-switch-menu button.disabled:hover { color: var(--faint); background: transparent; cursor: not-allowed; }\n.provider-usage-view { height: 271px; min-width: 0; display: flex; flex-direction: column; padding: 7px 12px 5px; }\n/* 顶部统计卡片：彩色圆底图标在左，标签 + 数值在右 */\n.provider-usage-summary { flex: 0 0 auto; display: flex; gap: 7px; }\n.provider-stat { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 7px; padding: 5px 9px; border: 1px solid var(--line-inner); border-radius: 10px; background: var(--surface-2); }\n.stat-icon { width: 20px; height: 20px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; }\n.provider-stat .stat-copy { min-width: 0; display: grid; gap: 2px; }\n.provider-stat .stat-copy > span { color: var(--ink-soft); font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.provider-stat strong { color: var(--ink); font-size: 12px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n/* 顶部图标配色（参考图）：花费红闪电 / Token 蓝机器人 / 活跃日绿日历；下方详情行用不同图标避免重复 */\n.provider-stat.cost .stat-icon { color: var(--coral); background: var(--coral-bg); }\n.provider-stat.tokens .stat-icon { color: var(--sky); background: color-mix(in srgb, var(--sky) 15%, transparent); }\n.provider-stat.days .stat-icon { color: var(--green-deep); background: var(--green-bg); }\n.provider-stat.plan .stat-icon { color: var(--violet, #7c5cfc); background: color-mix(in srgb, var(--violet, #7c5cfc) 15%, transparent); }\n.provider-stat.streak .stat-icon { color: var(--coral); background: var(--coral-bg); }\n.provider-stat.peak .stat-icon { color: var(--cyan); background: color-mix(in srgb, var(--cyan) 15%, transparent); }\n.provider-stat.longest .stat-icon { color: var(--violet, #7c5cfc); background: color-mix(in srgb, var(--violet, #7c5cfc) 15%, transparent); }\n/* 热力图标题行：标题在左，「较少→较多」图例在右 */\n.provider-heatmap-head { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 5px 1px 0; }\n.provider-heatmap-title { color: var(--ink-soft); font-size: 10px; font-weight: 700; }\n.provider-heatmap-legend { display: flex; align-items: center; gap: 3px; color: var(--faint); font-size: 7px; }\n.provider-heatmap-legend .provider-heatmap-cell { width: 7px; height: 7px; }\n.provider-heatmap-legend .provider-heatmap-cell.level-1 { background: color-mix(in srgb, var(--cyan) 35%, var(--surface-3)); }\n.provider-heatmap-legend .provider-heatmap-cell.level-2 { background: color-mix(in srgb, var(--cyan) 58%, var(--surface-3)); }\n.provider-heatmap-legend .provider-heatmap-cell.level-3 { background: color-mix(in srgb, var(--cyan) 82%, var(--surface-3)); }\n.provider-heatmap-legend .provider-heatmap-cell.level-4 { background: color-mix(in srgb, var(--cyan) 88%, white 12%); }\n/* 热力图外框：接管纵向弹性，滚动容器装在里面；两端渐隐覆盖层提示左右还有更多月份可滑 */\n.provider-heatmap-frame { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }\n.provider-heatmap-fade { position: absolute; top: 0; bottom: 0; z-index: 1; width: 22px; pointer-events: none; opacity: 0; transition: opacity .15s; }\n.provider-heatmap-fade.left { left: 0; background: linear-gradient(90deg, var(--surface-2), transparent); }\n.provider-heatmap-fade.right { right: 0; background: linear-gradient(270deg, var(--surface-2), transparent); }\n.provider-heatmap-frame.more-left .provider-heatmap-fade.left { opacity: 1; }\n.provider-heatmap-frame.more-right .provider-heatmap-fade.right { opacity: 1; }\n.provider-heatmap-frame.more-left .provider-heatmap-scroll, .provider-heatmap-frame.more-right .provider-heatmap-scroll { cursor: grab; }\n.provider-heatmap-frame.more-left .provider-heatmap-scroll:active, .provider-heatmap-frame.more-right .provider-heatmap-scroll:active { cursor: grabbing; }\n.provider-heatmap-scroll { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; touch-action: pan-x pan-y; padding: 4px 3px; border: 1px solid var(--line-inner); border-radius: 8px; background: var(--surface-2); }\n.provider-heatmap-scroll::-webkit-scrollbar { display: none; }\n.provider-heatmap-scroll:focus-visible { outline: 2px solid var(--focus-border); outline-offset: -2px; }\n.provider-heatmap-board { display: grid; grid-template-columns: 10px auto; grid-template-rows: 11px auto; align-items: flex-start; gap: 3px 7px; width: fit-content; margin: auto; }\n.provider-heatmap-corner { grid-column: 1; grid-row: 1; }\n.provider-heatmap-months { grid-column: 2; grid-row: 1; position: relative; height: 11px; overflow: visible; color: var(--faint); font-size: 8px; white-space: nowrap; }\n.provider-heatmap-weekdays { grid-column: 1; grid-row: 2; width: 10px; display: grid; grid-template-rows: repeat(7, var(--hm-cell-h)); row-gap: var(--hm-gap, 2px); color: var(--faint); font-size: 8px; text-align: center; }\n.provider-heatmap-weekdays span { display: grid; place-items: center; }\n.provider-heatmap-grid { grid-column: 2; grid-row: 2; display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, var(--hm-cell-h)); grid-auto-columns: var(--hm-cell); gap: var(--hm-gap, 2px); }\n/* 方格：GitHub 式圆角小方块，色阶为参考图同款青色系；无数据的日子与空档同色 */\n.provider-heatmap-cell { width: 8px; height: 8px; display: block; flex: 0 0 auto; border-radius: 3px; background: var(--surface-3); }\n.provider-heatmap-grid button.provider-heatmap-cell { width: var(--hm-cell); height: var(--hm-cell-h); appearance: none; border: 0; padding: 0; border-radius: max(3px, calc(var(--hm-cell) * 0.16)); background: var(--surface-3); }\n.provider-heatmap-grid button.provider-heatmap-cell.level-1 { background: color-mix(in srgb, var(--cyan) 35%, var(--surface-3)); }\n.provider-heatmap-grid button.provider-heatmap-cell.level-2 { background: color-mix(in srgb, var(--cyan) 58%, var(--surface-3)); }\n.provider-heatmap-grid button.provider-heatmap-cell.level-3 { background: color-mix(in srgb, var(--cyan) 82%, var(--surface-3)); }\n.provider-heatmap-grid button.provider-heatmap-cell.level-4 { background: color-mix(in srgb, var(--cyan) 88%, white 12%); }\n.provider-heatmap-grid button.provider-heatmap-cell.level-missing { background: var(--surface-3); }\n.provider-heatmap-grid button.provider-heatmap-cell:hover { box-shadow: 0 0 0 1px var(--ink-soft); }\n.provider-heatmap-grid button.provider-heatmap-cell.selected { box-shadow: 0 0 0 2px var(--focus-border); }\n.provider-heatmap-grid button.provider-heatmap-cell:focus-visible { outline: 2px solid var(--focus-border); outline-offset: 1px; }\n.provider-heatmap-cell.blank { width: var(--hm-cell); height: var(--hm-cell-h); visibility: hidden; }\n/* 当日明细：淡青描边卡片，一个卡片内三段纯文字、竖线分隔（参考图无图标）；标签「当日花费」默认显示，切到其他日子换成具体日期 */\n.provider-day-card { flex: 0 0 auto; margin: 6px 1px 0; padding: 4px 10px; border: 1px solid color-mix(in srgb, var(--cyan) 30%, var(--line)); border-radius: 10px; background: var(--surface-2); display: grid; grid-template-columns: repeat(3, 1fr); }\n.day-cell { min-width: 0; display: flex; align-items: center; padding: 2px 4px; }\n.day-cell + .day-cell { border-left: 1px solid var(--line-inner); padding-left: 12px; }\n.day-cell > div { min-width: 0; display: grid; gap: 1px; }\n.day-cell > div > span { color: var(--muted); font-size: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.day-cell b { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--ink); font-size: 10px; font-weight: 700; white-space: nowrap; }\n.provider-usage-state { height: 271px; display: flex; align-items: center; justify-content: center; gap: 11px; padding: 22px 28px; color: var(--muted); }\n.provider-usage-state > svg { flex: 0 0 auto; color: var(--green); }\n.provider-usage-state-icon { width: 36px; height: 36px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 10px; color: var(--green-deep); background: var(--green-bg); }\n.provider-usage-state > div { min-width: 0; display: grid; gap: 5px; flex: 0 1 auto; max-width: 52em; justify-items: center; text-align: center; }\n.provider-usage-state b { color: var(--ink); font-size: 13.5px; }\n.provider-usage-state small { color: var(--muted); font-size: 11.5px; line-height: 1.55; }\n.provider-usage-state em { color: var(--coral-deep); font-size: 10.5px; font-style: normal; }\n.provider-usage-state.auth-required .provider-usage-state-icon { color: var(--coral-deep); background: var(--coral-bg); }\n.provider-usage-state.connect-guide .provider-usage-state-icon { color: var(--sky); background: color-mix(in srgb, var(--sky) 15%, transparent); }\n.provider-usage-state .outline-button, .provider-usage-state .primary-button { flex: 0 0 auto; padding: 7px 9px; }\n.provider-usage-state.connect-guide { flex-direction: column; gap: 0; text-align: center; }\n.provider-usage-state.connect-guide .provider-usage-state-icon { margin-bottom: 14px; }\n.provider-usage-state.connect-guide > div { flex: 0 0 auto; width: 100%; max-width: 300px; gap: 7px; }\n.provider-usage-state.connect-guide .primary-button { min-width: 136px; margin-top: 18px; padding: 8px 14px; }\n\n/* DeepSeek 账号编辑页中的可选连接：状态与余额 API 分开表达，防止用户误以为\n   断开官方账号会停止原有额度巡检。 */\n.provider-login-option { min-width: 0; margin: 2px 0 10px; padding: 11px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }\n.provider-login-option > span { min-width: 0; }\n.provider-login-option b small { margin-left: 4px; color: var(--green-deep); font-size: 8px; font-weight: 500; }\n.provider-login-option i { flex: 0 0 auto; }\n.provider-login-option { cursor: pointer; }\n.provider-login-option input:focus-visible + i { outline: 2px solid var(--focus-border); outline-offset: 2px; box-shadow: 0 0 0 4px var(--focus-ring); }\n.provider-connection-card { display: grid; gap: 9px; margin: 12px 0 16px; padding: 11px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: transparent; }\n.provider-connection-copy { display: flex; align-items: flex-start; gap: 9px; }\n.provider-connection-icon { width: 28px; height: 28px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 8px; color: var(--green-deep); background: var(--green-bg); }\n.provider-connection-copy > div { min-width: 0; display: grid; gap: 3px; }\n.provider-connection-copy b { color: var(--ink); font-size: 11px; }\n.provider-connection-copy b em { margin-left: 4px; padding: 1px 5px; border-radius: 7px; color: var(--muted); bac ight; white-space: nowrap; }\n.local-cli-model-row .col-share { font-size: 11px; color: var(--ink-soft); text-align: right; white-space: nowrap; }\n\n@media (min-width: 800px) {\n  .local-cli-models-view { --model-columns: clamp(170px, 22vw, 240px) minmax(160px, 1fr) 84px 64px; }\n  .local-cli-model-header { padding: 9px 14px; font-size: 11px; }\n  .local-cli-model-row { padding: 8px 14px; }\n  .local-cli-model-row .col-usage { grid-template-columns: minmax(0, 1fr) 88px; gap: 16px; }\n  .local-cli-model-row .col-model b, .local-cli-model-row .col-total, .local-cli-model-row .col-cache, .local-cli-model-row .col-share { font-size: 13px; }\n}\n\n/* 渠道单选下拉:固定宽度按钮 + portal 菜单 */\n.local-cli-channel-select { width: 96px; height: 26px; flex: 0 0 96px; display: inline-flex; align-items: center; justify-content: space-between; gap: 4px; padding: 0 6px 0 8px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink-soft); background: var(--control); font-size: 10px; }\n.local-cli-channel-select:hover { border-color: var(--hover-border); color: var(--ink); }\n.local-cli-channel-select svg { transition: transform .15s; flex: 0 0 auto; }\n.local-cli-channel-select svg.flip { transform: rotate(180deg); }\n.local-cli-channel-value { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.local-cli-channel-menu { z-index: 70; display: flex; flex-direction: column; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--drawer-bg); box-shadow: var(--shadow-strong); overflow: hidden; }\n.local-cli-channel-search { display: flex; align-items: center; gap: 5px; padding: 6px 8px; border-bottom: 1px solid var(--line-inner); color: var(--faint); }\n.local-cli-channel-search input { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; color: var(--ink); font-size: 10px; outline: none; }\n.local-cli-channel-options { max-height: 208px; overflow-y: auto; scrollbar-width: thin; padding: 4px; }\n.local-cli-channel-option { width: 100%; display: flex; align-items: center; gap: 6px; padding: 5px 7px; border: 0; border-radius: 6px; color: var(--ink-soft); background: transparent; font-size: 10px; text-align: left; }\n.local-cli-channel-option.active { background: var(--surface-3); }\n.local-cli-channel-option.selected { color: var(--ink); }\n.local-cli-channel-option:disabled { opacity: .48; cursor: not-allowed; background: transparent; }\n.local-cli-channel-option:disabled:hover { background: transparent; }\n.local-cli-channel-option > small { flex: 0 0 auto; color: var(--faint); font-size: 8px; }\n.local-cli-channel-name { flex: 1 1 auto; min-width: 0; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.local-cli-channel-name i { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }\n.local-cli-channel-check { color: var(--green-deep); }\n.local-cli-channel-empty { padding: 10px; color: var(--faint); font-size: 10px; text-align: center; }\n\n/* ── 首次使用引导向导 ── */\n.onboard-shell { height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; overflow: hidden; animation: fade-in .3s ease-out; }\n/* 引导页独占整块内容区：去掉主区留白，把可用高度全部让给卡片 */\n.main-shell:has(> .content-area > .onboard-shell) { padding: 4px 6px 6px; }\n.content-area:has(> .onboard-shell) { height: 100%; padding-top: 0; }\n/* 卡片尺寸锁死：宽 520、高 400–420，四步（含接入步的两个状态）完全一致，绝不随内容变化 */\n.onboard-card { width: min(520px, 100%); height: 420px; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; padding: 40px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface-trans); box-shadow: var(--shadow); backdrop-filter: blur(10px); animation: rise-in .28s ease-out; box-sizing: border-box; }\n/* 顶部区域：进度条 + 标题 + 副标题，固定不浮动 */\n.onboard-head { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; padding-top: 4px; }\n.onboard-head h1, .onboard-group h1 { margin: 0; font-size: 20px; line-height: 1.3; letter-spacing: -.03em; text-align: center; }\n.onboard-head .onboard-sub { margin: 8px 0 0; }\n.onboard-sub { max-width: 440px; color: var(--muted); font-size: 13px; line-height: 1.5; text-align: center; }\n.onboard-steps { flex: 0 0 auto; display: flex; justify-content: center; align-items: center; gap: 6px; width: 100%; height: 8px; margin-bottom: 18px; }\n.onboard-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); transition: .2s; }\n.onboard-dot.past { background: var(--green); }\n.onboard-dot.active { background: var(--green); width: 20px; border-radius: 4px; }\n/* 中间区域：自适应撑开，内容垂直水平居中 */\n.onboard-body { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; width: 100%; overflow: hidden; }\n/* 接入步：三区骨架中的中间区，纵向排布并垂直居中；卡片高度固定，底部按钮永不被顶走 */\n/* 接入步：中部区拆成「固定展示区 + 添加入口」两段，展示区吃掉剩余高度（6 格网格刚好放满） */\n.onboard-body.is-connect { flex-direction: column; align-items: stretch; justify-content: flex-start; padding-top: 2px; }\n/* 导入步：左右两栏。左侧是能导入的账号清单（占主要空间），右侧是导入按钮与无法导入的原因 */\n.onboard-body.is-ccswitch { flex-direction: row; align-items: center; justify-content: stretch; gap: 12px; min-height: 0; padding: 6px 0; }\n.onboard-import { flex: 0 1 auto; min-height: 0; max-height: 172px; display: flex; align-items: stretch; gap: 14px; width: 100%; }\n.onboard-import-main { flex: 1 1 auto; min-width: 0; min-height: 0; max-height: 172px; display: flex; }\n/* 左侧清单：可勾选、可滚动，滚动条内嵌且低调 */\n.onboard-scan-list { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; width: 100%; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding-right: 2px; }\n.onboard-scan-list::-webkit-scrollbar { width: 4px; }\n.onboard-scan-list::-webkit-scrollbar-thumb { border-radius: 2px; background: rgba(150, 160, 158, .22); }\n.onboard-scan-list::-webkit-scrollbar-thumb:hover { background: rgba(150, 160, 158, .5); }\n.onboard-scan-list::-webkit-scrollbar-track { background: transparent; }\n.onboard-scan-row { display: flex; align-items: center; gap: 10px; height: 52px; min-height: 52px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); cursor: pointer; box-sizing: border-box; }\n.onboard-scan-row:hover { border-color: var(--hover-border); }\n.onboard-scan-row input { flex: 0 0 auto; width: 13px; height: 13px; margin: 0; accent-color: var(--green); }\n.onboard-scan-copy { flex: 1; min-width: 0; display: grid; gap: 2px; }\n.onboard-scan-copy b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }\n.onboard-scan-copy small { color: var(--faint); font-size: 10px; }\n.onboard-scan-ok { flex: 0 0 auto; color: var(--green); }\n/* 左侧空态 / 读取中：始终有内容可看，不留空白 */\n.onboard-import-hint { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 0; padding: 16px; border: 1px dashed color-mix(in srgb, var(--faint) 45%, transparent); border-radius: 10px; color: var(--muted); text-align: center; box-sizing: border-box; }\n.onboard-import-hint svg { color: var(--faint); }\n.onboard-import-hint b { font-size: 12px; font-weight: 600; color: var(--ink-soft); }\n.onboard-import-hint span { font-size: 10px; line-height: 1.5; }\n/* 右侧：导入按钮在上，无法导入的条目在下（只列前 3 条，完整原因悬停可见） */\n.onboard-import-side { flex: 0 0 auto; width: 172px; display: flex; flex-direction: column; justify-content: center; gap: 10px; min-height: 0; }\n.onboard-import-go { flex: 0 0 auto; width: 100%; padding: 9px 12px; font-size: 12px; font-weight: 700; }\n.onboard-import-blocked { flex: 0 0 auto; max-height: 96px; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }\n.onboard-import-blocked-title { color: var(--faint); font-size: 10px; }\n.onboard-blocked-row { display: flex; align-items: center; gap: 5px; min-width: 0; color: var(--muted); font-size: 10px; }\n.onboard-blocked-row svg { flex: 0 0 auto; color: var(--coral); }\n.onboard-blocked-row b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }\n.onboard-blocked-row small { flex: 0 0 auto; color: var(--faint); font-size: 9px; white-space: nowrap; }\n.onboard-blocked-row.is-more { cursor: help; }\n.onboard-blocked-row.is-more small { color: var(--hover-border); }\n.onboard-scan-error { flex: 1 1 auto; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--warn-border); border-radius: 10px; color: var(--coral-deep); background: var(--coral-bg); font-size: 11px; }\n/* 图1 / 图4：图标 + 标题 + 副标题 + 按钮作为一个 group 整体居中，间距依次 24 / 8 / 32 */\n.onboard-body.is-hero { justify-content: center; padding-bottom: 26px; }\n.onboard-group { display: flex; flex-direction: column; align-items: center; width: 100%; }\n/* 两页的图标外框都是 80×80，欢迎页是圆角方图、完成页是圆形对勾 + 光环，按钮落点因此完全一致 */\n.onboard-hero { width: 80px; height: 80px; display: grid; place-items: center; margin-bottom: 24px; }\n.onboard-hero img { width: 80px; height: 80px; border-radius: 20px; box-shadow: 0 12px 28px rgba(63, 179, 132, .28); }\n.onboard-hero-done span { width: 66px; height: 66px; display: grid; place-items: center; border-radius: 50%; color: var(--green); background: var(--green-bg); box-shadow: 0 0 0 7px var(--green-bg-2); }\n.onboard-group .onboard-sub { margin: 8px 0 0; }\n.onboard-cta { margin-top: 32px; }\n/* 底部区域：按钮组，固定距底，margin-top:auto 推到底部 */\n.onboard-foot { flex: 0 0 auto; display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: auto; padding-top: 8px; }\n.onboard-foot .primary-button, .onboard-foot .outline-button, .onboard-cta, .onboard-import-go { display: inline-flex; justify-content: center; align-items: center; min-width: 100px; padding: 8px 18px; font-size: 12px; border-radius: 9px; }\n.onboard-foot .primary-button, .onboard-cta, .onboard-import-go { color: #0f1a15; background: var(--green); border-color: transparent; font-weight: 700; }\n.onboard-foot .primary-button:hover, .onboard-cta:hover, .onboard-import-go:hover { filter: brightness(1.1); color: #0f1a15; }\n.onboard-theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; width: 100%; }\n.onboard-theme-card { position: relative; display: grid; gap: 4px; justify-items: center; padding: 13px 12px 11px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); color: var(--ink); transition: border-color .16s, box-shadow .16s, transform .16s; }\n.onboard-theme-card:hover { border-color: var(--hover-border); transform: translateY(-1px); }\n.onboard-theme-card.selected { border-color: var(--focus-border); box-shadow: 0 0 0 3px var(--focus-ring); }\n.onboard-theme-card b { font-size: 12px; }\n.onboard-theme-card small { color: var(--faint); font-size: 9px; }\n.onboard-theme-preview { width: 100%; height: 52px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 7px; border-radius: 8px; margin-bottom: 3px; }\n.onboard-theme-preview i { border-radius: 5px; display: block; }\n.preview-dark { background: #141d1f; box-shadow: inset 0 0 0 1px #2c393b; }\n.preview-dark i { background: #263334; }\n.preview-dark i:first-child { background: #3fb384; opacity: .85; }\n.preview-light { background: #f3f5f1; box-shadow: inset 0 0 0 1px #dfe4df; }\n.preview-light i { background: #ffffff; box-shadow: 0 1px 3px rgba(50, 66, 61, .12); }\n.preview-light i:first-child { background: #2e8b66; opacity: .85; }\n.onboard-theme-check { position: absolute; top: 9px; right: 9px; width: 21px; height: 21px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: var(--green); }\n/* ── 接入步展示区 ── 有/无账号共用的固定尺寸区域，内容垂直水平居中、永不滚动 */\n.onboard-slots { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; overflow: hidden; }\n.onboard-slots-bar { flex: 0 0 auto; display: flex; justify-content: flex-end; width: 100%; }\n/* 手动添加入口：账号信息区右上角的轻量图标，风格与周边的细线一致 */\n.onboard-slots-add { width: 26px; height: 26px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: transparent; color: var(--muted); transition: border-color .16s, color .16s, background .16s; }\n.onboard-slots-add:hover { border-color: var(--hover-border); color: var(--ink); background: var(--surface-2); }\n/* 无账号：90px 轻量占位，虚线更浅、文字更醒目 */\n.onboard-empty { width: 100%; height: 90px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--ink-soft); border: 1px dashed var(--onboard-dash); border-radius: 10px; box-sizing: border-box; }\n.onboard-empty svg { color: var(--faint); opacity: .5; }\n.onboard-empty span { font-size: 12px; }\n/* 有账号：双列网格，每格 64px；容器最高 140px，账号更多时在内部平滑滚动，滚动条 4px 极浅 */\n.onboard-grid { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 64px; gap: 12px; width: 100%; max-height: 140px; overflow-y: auto; overscroll-behavior: contain; padding-right: 2px; box-sizing: border-box; }\n.onboard-grid::-webkit-scrollbar { width: 4px; }\n.onboard-grid::-webkit-scrollbar-thumb { border-radius: 2px; background: rgba(150, 160, 158, .22); }\n.onboard-grid::-webkit-scrollbar-thumb:hover { background: rgba(150, 160, 158, .5); }\n.onboard-grid::-webkit-scrollbar-track { background: transparent; }\n.onboard-cell { display: flex; align-items: center; gap: 9px; height: 64px; min-width: 0; padding: 0 12px; border-radius: 8px; background: var(--onboard-tile); box-sizing: border-box; }\n/* 厂商图标只留 24px 图形本身，不带背景框 */\n.onboard-cell .provider-logo, .onboard-cell .provider-logo.sm { width: 24px; height: 24px; border-radius: 6px; font-size: 11px; background: none; box-shadow: none; }\n.onboard-cell b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 1  $('#pro-badge').hidden=!IS_PRO;
 if(!DATA?.candidates?.length){$('#empty').hidden=false;return;}
 const C=DATA.candidates,SIZES={desktop:{w:1280,h:900},mobile:{w:390,h:844}},KEY=`oil-ui:${DATA.fingerprint||DATA.project}`;
 const byId=Object.fromEntries(C.map(c=>[c.id,c])),DIRS=C.filter(c=>!c.baseline),no=c=>c.baseline?t('baseline'):String(DIRS.indexOf(c)+1).padStart(2,'0'),vtName=c=>`stage-${C.indexOf(c)}`;
 const root=document.documentElement,calm=matchMedia('(prefers-reduced-motion: reduce)'),narrow=()=>matchMedia('(max-width:760px)').matches;
 const ease=n=>getComputedStyle(root).getPropertyValue(`--${n}`).trim()||'ease-out';
 let st={layout:'compare',viewport:'desktop',current:C[0].id,chosen:null},stored=true,zoomActual=false,compareScroll=0,gridKey='',loupeKey='',toastTimer=0;
 try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&typeof saved==='object'){for(const key of Object.keys(st))if(key in saved)st[key]=saved[key];if(!byId[st.chosen])st.chosen=null;if(!byId[st.current])st.current=C[0].id;if(!['compare','loupe'].includes(st.layout))st.layout='compare';if(!SIZES[st.viewport])st.viewport='desktop';}}catch{stored=false;}
 function save(){if(!stored)return;try{localStorage.setItem(KEY,JSON.stringify(st));}catch{stored=false;}}
 const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;};
 const shown=()=>C;
 const services=new Map(C.filter(c=>c.kind==='url').map(c=>[c.content,{ready:null,pending:false}]));
 const startCommand=DATA.serve?(DATA.serve.cwd?`cd "${DATA.serve.cwd.replace(/[\\"$`]/g,'\\$&')}" && ${DATA.serve.command}`:DATA.serve.command):'';

 function serviceNotice(){
  const note=el('div','service-note'),message=el('div','service-message');note.hidden=true;note.setAttribute('role','status');
  message.append(el('h3',null,t('serviceUnavailable')),el('p',null,t('serviceHelp')));
  if(startCommand){const row=el('div','service-command'),button=el('button','tool',t('copyCommand'));button.type='button';button.dataset.copyServe='';button.setAttribute('aria-label',t('copyCommandLabel'));button.addEventListener('click',()=>copy(startCommand));row.append(el('code',null,startCommand),button);message.append(row);}
  note.append(message);return note;
 }
 function syncService(s,c){
  const ready=services.get(c.content).ready,m=s.querySelector('iframe');
  s.classList.toggle('offline',ready===false);s.querySelector('.service-note').hidden=ready!==false;m.hidden=ready!==true;
  if(ready===true){if(m.getAttribute('src')!==c.content){s.classList.remove('ready');m.src=c.content;}}
  else{s.classList.remove('ready');if(m.hasAttribute('src'))m.removeAttribute('src');}
 }
 async function checkService(url){
  const state=services.get(url);if(state.pending)return;state.pending=true;
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),2500);
  const target=new URL(url);if(target.hostname==='[::1]')target.hostname='localhost';
  try{await fetch(target.href,{mode:'no-cors',cache:'no-store',credentials:'omit',signal:controller.signal});state.ready=true;}catch{state.ready=false;}
  finally{clearTimeout(timer);state.pending=false;}
  $$('.stage').forEach(s=>{const c=byId[s.dataset.id];if(c.kind==='url'&&c.content===url)syncService(s,c);});
 }
 const checkServices=()=>services.forEach((state,url)=>checkService(url));

 // 动效工具：尊重“减少动态效果”，浏览器不支持时直接落到最终状态
 function animate(node,frames,opts){if(calm.matches||!node?.animate)return;try{node.animate(frames,opts);}catch{node.animate(frames,{...opts,easing:'ease-out'});}}
 let vtSeq=0;
 function morph(update,kind){
  if(calm.matches||!document.startViewTransition||document.hidden){update();return;}
  const n=++vtSeq;root.dataset.vt=kind||'';
  try{document.startViewTransition(update).finished.finally(()=>{if(n===vtSeq)delete root.dataset.vt;});}catch{update();}
 }
 function slideTo(ind,target,instant){
  if(!ind||!target||!target.offsetWidth)return;
  if(instant)ind.style.transition='none';
  ind.style.width=`${target.offsetWidth}px`;ind.style.height=`${target.offsetHeight}px`;ind.style.transform=`translate(${target.offsetLeft}px,${target.offsetTop}px)`;
  if(instant){ind.offsetWidth;ind.style.transition='';}
 }
 const placeThumbs=instant=>$$('.seg').forEach(s=>slideTo(s.querySelector('.thumb'),s.querySelector('[aria-pressed=true]'),instant));
 const placeFilm=instant=>{const f=$('#film');slideTo(f.querySelector('.film-ind'),f.querySelector('[aria-current=true]'),instant);};

 $('#project').textContent=DATA.project;
 $('#brief').textContent=DATA.brief||'';

 function stripMini(c){const s=el('span','strip-mini');(c.palette||[]).forEach(h=>{const i=el('i');i.style.background=h;s.append(i);});return s;}
 function stage(c,interactive){
  const s=el('div','stage');s.dataset.id=c.id;
  const m=document.createElement(c.kind==='image'?'img':'iframe');
  if(c.kind==='image'){m.alt=c.name;m.draggable=false;}
  else{m.title=c.name;m.setAttribute('sandbox',c.kind==='url'?'allow-scripts allow-same-origin allow-forms':c.interactive?'allow-scripts allow-forms':'');m.referrerPolicy='no-referrer';if(!interactive)m.tabIndex=-1;}
  m.addEventListener('load',()=>{if(c.kind==='url'&&services.get(c.content).ready!==true)return;s.classList.add('ready');fit(s);});
  if(c.kind==='image')m.src=c.content;else if(c.kind!=='url')m.srcdoc=c.content;
  s.append(m);
  if(c.kind==='url'){s.append(serviceNotice());syncService(s,c);}
  if(c.kind!=='html'||c.interactive)s.append(el('span','static',c.kind==='url'?t('live'):c.kind==='image'?t('image'):t('interactive')));
  return s;
 }
 function fit(s){
  if(!s.isConnected)return;
  const native=byId[s.dataset.id].nativeViewport,size=native?{w:native.width,h:native.height}:SIZES[st.viewport],m=s.querySelector('iframe,img'),box=s.parentElement;let r;
  if(box.classList.contains('slide')){const cs=getComputedStyle(box),w=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),h=narrow()?(native?innerHeight-$('#bar').offsetHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom):Infinity):box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);r=box.dataset.zoom==='actual'?1:Math.min(w/size.w,h/size.h,1);}
  else r=Math.min(box.clientWidth/size.w,1);
  if(!(r>0))return;
  s.style.width=`${size.w*r}px`;s.style.height=`${size.h*r}px`;m.style.width=`${size.w}px`;m.style.height=`${size.h}px`;m.style.transform=`scale(${r})`;
 }
 const fitAll=()=>$$('.stage').forEach(fit),refit=()=>requestAnimationFrame(fitAll);

 function specList(c){
  const dl=el('dl','spec');const row=(k,v)=>{dl.append(el('dt',null,k),el('dd',null,v));};
  row(t('fonts'),c.typography);row(t('traits'),(c.traits||[]).join(' · '));return dl;
 }
 function pickButton(c){const b=el('button','pick');b.type='button';b.dataset.pick=c.id;b.addEventListener('click',()=>choose(c.id));return b;}
 function card(c,i){
  const a=el('article','card');a.dataset.id=c.id;a.style.setProperty('--i',i);a.setAttribute('aria-label',c.name);
  const frame=el('div','frame');frame.style.viewTransitionName=vtName(c);const s=stage(c,false);
  const hit=el('button','hit');hit.type='button';hit.setAttribute('aria-label',t('viewDirection',{name:c.name}));hit.addEventListener('click',()=>setLayout('loupe',c.id));
  s.append(hit);frame.append(s,el('span','pick-mark',t('selected')),el('span','peek',t('peek')));
  const cap=el('div','cap');cap.style.viewTransitionName=`cap-${C.indexOf(c)}`;cap.append(el('span',c.baseline?'no base':'no',no(c)),el('h2','name',c.name),stripMini(c),pickButton(c));
  const lede=el('p','lede',c.concept);lede.title=c.concept;lede.style.viewTransitionName=`lede-${C.indexOf(c)}`;
  a.append(frame,cap,lede);return a;
 }
 function syncCompare(){
  const list=shown(),g=$('#grid'),key=list.map(c=>c.id).join();
  if(key!==gridKey){gridKey=key;g.replaceChildren(...list.map(card));}
  g.style.setProperty('--cols',Math.min(Math.max(list.length,1),st.viewport==='mobile'?4:3));
  $$('.card .frame').forEach(f=>f.dataset.viewport=byId[f.parentElement.dataset.id].nativeViewport?'native':st.viewport);
 }

 // 单张查看：所有方向预先排成一条横向轨道，切换时整条轨道滑动，不重新加载画面
 function syncLoupe(dir){
  const list=shown(),key=list.map(c=>c.id).join();if(!list.length)return;
  if(key!==loupeKey){
   loupeKey=key;dir=0;
   $('#track').replaceChildren(...list.map(c=>{const sl=el('div','slide');sl.dataset.id=c.id;sl.append(stage(c,true));return sl;}));
   $('#film').replaceChildren(el('span','film-ind'),...list.map(c=>{const b=el('button');b.type='button';b.dataset.id=c.id;b.append(el('span','fn',no(c)),el('span','ft',c.name),stripMini(c));b.addEventListener('click',()=>go(c.id));return b;}));
  }
  if(!list.some(c=>c.id===st.current))st.current=list[0].id;
  const i=list.findIndex(c=>c.id===st.current),track=$('#track');
  if(!dir)track.style.transition='none';
  track.style.transform=`translateX(${-i*100}%)`;
  if(!dir){track.offsetWidth;track.style.transition='';}
  $$('.slide').forEach(sl=>{const on=sl.dataset.id===st.current;sl.classList.toggle('is-current',on);sl.inert=!on;sl.dataset.zoom=on&&zoomActual?'actual':'fit';sl.firstElementChild.style.viewTransitionName=on?vtName(byId[sl.dataset.id]):'none';});
  $('#prev').disabled=i<=0;$('#next').disabled=i>=list.length-1;
  $$('#film button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===st.current)));
  renderInfo(dir);placeFilm(!dir);
  const cur=$('#film [aria-current=true]'),f=$('#film');
  if(cur&&f.scrollWidth>f.clientWidth)f.scrollTo({left:cur.offsetLeft-16,behavior:calm.matches||!dir?'auto':'smooth'});
 }
 function renderInfo(dir){
  const c=byId[st.current],body=$('#info-body');
  const sw=el('div','big-sw');(c.palette||[]).forEach(h=>{const d=el('div');const x=el('i');x.style.background=h;d.append(x,h.toUpperCase());sw.append(d);});
  const tools=el('div','tools');const z=el('button','tool',zoomActual?t('fit'):t('actual'));z.id='zoom';z.type='button';z.setAttribute('aria-pressed',String(zoomActual));z.addEventListener('click',toggleZoom);tools.append(z);
  const hint=el('p','hint');hint.innerHTML=t('keyboardHint');
  const blocks=[el('span','idx',no(c)),el('h2','name',c.name)];
  blocks.push(el('p','north',c.concept),sw,specList(c));
  blocks.push(pickButton(c),tools,hint);
  body.replaceChildren(...blocks);paintChoice();
  if(dir)animate(body,[{opacity:0,transform:`translateX(${dir*18}px)`},{opacity:1,transform:'none'}],{duration:420,easing:ease('glide')});
 }
 function toggleZoom(){
  morph(()=>{zoomActual=!zoomActual;const sl=$('.slide.is-current');sl.dataset.zoom=zoomActual?'actual':'fit';fitAll();sl.scrollTo(0,0);const z=$('#zoom');z.textContent=zoomActual?t('fit'):t('actual');z.setAttribute('aria-pressed',String(zoomActual));},'reshape');
 }

 function render(){
  const list=shown(),loupe=st.layout==='loupe'&&list.length>0;
  $('#compare-view').hidden=st.layout!=='compare'||!list.length;$('#loupe').hidden=!loupe;
  syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  if(layout==='loupe'&&st.layout==='compare')compareScroll=scrollY;
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   window.scrollTo(0,compareScroll);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect();
   if(r&&(r.top<60||r.bottom>innerHeight))a.scrollIntoView({block:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 选择即复制：再次点击“已选择”重新复制这个方向
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?t('selected'):t('selectedCopy')):(short?t('select'):t('selectDirection'))));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?t('recopyTitle'):t('selectTitle');});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
 }
 function copyText(){const c=byId[st.chosen];let text=t('copyChoice',{round:DATA.round?t('copyRound',{round:DATA.round}):'',number:no(c),name:c.name});return text;}
 async function copy(t=copyText()){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,text){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?t('copied'):t('copyFailed');n.querySelector('code').textContent=ok?text.replace(/\n/g,' · '):text;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 // 每个候选都声明了固定画布时，桌面和手机的切换不起作用，收起来。
 if(C.every(c=>c.nativeViewport))$('[data-i18n-aria-label="viewportLabel"]').style.display='none';
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
