name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 各平台只构建、不发布,产物先存到 artifacts,避免并行发布创建出重复 Release
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: --win
          - os: macos-latest
            targets: --mac --x64 --arm64
          - os: ubuntu-latest
            targets: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Package (${{ matrix.os }})
        run: npx electron-builder ${{ matrix.targets }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          retention-days: 1
          path: |
            release/**
            !release/win-unpacked/**
            !release/linux-unpacked/**
            !release/mac*/**
            !release/builder-debug.yml

  # 汇总所有平台的产物,一次性创建(非草稿)Release
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 提取 CHANGELOG 需要先检出代码（release 任务默认没有 workspace）
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge: true

      # Release 说明取 CHANGELOG 最顶部当前版本的章节，不用自动生成的提交列表
      - name: Extract release notes
        run: awk 'index($0, "## [") == 1 { n++ } n == 1' CHANGELOG.md > release-notes.md && cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          body_path: release-notes.md
          files: artifacts/**
